name: Build Signed BLE Testing APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      # Jana fail Keystore sah secara terus di dalam server runner
      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/release.jks \
            -alias blekey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "MuzRelease2026!" \
            -keypass "MuzRelease2026!" \
            -dname "CN=Muz, OU=Testing, O=MuzRC, L=Beaufort, ST=Sabah, C=MY"

      # Bina Signed Release APK
      - name: Build Signed Release APK
        run: gradle app:assembleRelease --stacktrace

      # Padam fail fizikal keystore selepas siap compile demi keselamatan
      - name: Clean Keystore
        if: always()
        run: rm -f app/release.jks

      # Muat naik fail APK Release ke tab Artifacts
      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BLE-Testing-Signed-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
